name: Deploy

# Le build et la publication se font sur le VPS, pilotés par l'orchestrateur
# du dépôt `portfolio` : ce workflow ne fait que déclencher
# `deploy-project.sh cashmire`, qui vérifie d'abord que `cashmire` est
# `deployed: true` dans portfolio/projects.yml (sinon il ne fait rien).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vlldnt-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH → deploy-project.sh cashmire
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id ; chmod 600 ~/.ssh/id
          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/id -p "$SSH_PORT" -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" 'bash /opt/vlldnt/scripts/deploy-project.sh cashmire'
